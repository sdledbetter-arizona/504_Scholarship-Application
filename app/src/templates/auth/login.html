{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

  <main class="flex-grow-1 py-5">
    <div class="container text-center">
      <h1 class="display-5 fw-semibold mb-3 text-dark">Scholarship Matching System</h1>
      <p class="lead mb-5 text-secondary">Please enter your username and password.</p>

      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <form class="p-4 shadow-sm bg-light rounded" method="post">
            <div class="mb-4 text-start">
              <label for="email" class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-4 text-start">
              <label for="pwd" class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control" id="pwd" name="pwd" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-ua-red w-100 py-2 text-uppercase fw-semibold">Login</button>
          </form>
      <p class="lead mt-5 text-secondary"><a href="/auth/reset-pwd">Forgot your password?</a></p>
        </div>
      </div>
    </div>
  </main>
{% endblock %}
